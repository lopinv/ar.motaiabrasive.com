name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and verify
        run: npm run build && npm run check:site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 同步构建产物到 gh-pages 分支（该分支由 CI 独占维护，首次运行自动创建）
  export-gh-pages:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: pages-artifact
          path: build

      - name: Push dist to gh-pages branch
        run: |
          set -e
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"
          mkdir -p work && cd work
          # 远端已有 gh-pages 则以其为基础（保留历史），否则新建
          if git clone -q --depth 1 --branch gh-pages --single-branch "$REMOTE" site 2>/dev/null; then
            cd site
          else
            mkdir site && cd site
            git init -q -b gh-pages
            git remote add origin "$REMOTE"
          fi
          git rm -rf . -q 2>/dev/null || true
          cp -R "$GITHUB_WORKSPACE/build/." .
          git add -A
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "pages: deploy ${GITHUB_SHA:0:12}"
          git push -q origin gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

